# Pre-commit hooks for AI Web Feeds project
# Install with: uv sync --extra dev && uv run pre-commit install
# Run manually: pre-commit run --all-files
# Docs: https://aiwebfeeds.com/docs/contributing/development#pre-commit-hooks

default_language_version:
  python: python3.13
  node: 20.11.0

repos:
  # ============================================================================
  # Python - Ruff (linting and formatting)
  # ============================================================================
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.18
  hooks:
      # Run the linter
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
    types_or: [python, pyi, jupyter]
      # Run the formatter
  - id: ruff-format
    types_or: [python, pyi, jupyter]

  # ============================================================================
  # Python - Security checks
  # ============================================================================
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args: [-c, pyproject.toml]
    additional_dependencies: ['bandit[toml]']
    exclude: ^tests/

  # ============================================================================
  # General file checks
  # ============================================================================
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: ^.*\.(md|rst)$
  - id: end-of-file-fixer
  - id: check-yaml
    args: [--allow-multiple-documents, --unsafe]
  - id: check-json
    exclude: ^(\.vscode/.*\.json|tsconfig.*\.json)$
  - id: check-toml
  - id: check-added-large-files
    args: [--maxkb=1000]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-docstring-first
  - id: debug-statements
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: name-tests-test
    args: [--pytest-test-first]
    exclude: ^tests/(conftest|__init__|helpers|fixtures)\.py$
  - id: requirements-txt-fixer
  - id: check-symlinks
  - id: detect-private-key
  - id: no-commit-to-branch
    args: [--branch, main, --branch, production]

  # ============================================================================
  # TypeScript/JavaScript - Prettier
  # ============================================================================
- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v4.0.0-alpha.8
  hooks:
  - id: prettier
    name: prettier (apps/web)
    files: ^apps/web/.*\.(js|jsx|ts|tsx|json|css|scss|md|mdx)$
    additional_dependencies:
    - prettier@3.1.0
    - prettier-plugin-tailwindcss

  # ============================================================================
  # YAML formatting
  # ============================================================================
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^\.github/

  # ============================================================================
  # Markdown formatting
  # ============================================================================
- repo: https://github.com/executablebooks/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-gfm
    - mdformat-black
    args: [--wrap, '88']
    exclude: ^(CHANGELOG\.md|apps/web/content/)$

  # ============================================================================
  # Spell checking
  # ============================================================================
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.2
  hooks:
  - id: codespell
    args:
    - --ignore-words-list
    - crate,nd,sav,ba,als,datas,socio,ser,oint,asent,lod,mape,afterAll
    exclude: ^(.*\.json|.*\.yaml|.*\.lock|.*\.svg|pnpm-lock\.yaml)$

  # ============================================================================
  # Validate pyproject.toml
  # ============================================================================
- repo: https://github.com/abravalheri/validate-pyproject
  rev: v0.25
  hooks:
  - id: validate-pyproject
    files: ^(packages/|apps/cli/|tests/).*pyproject\.toml$

  # ============================================================================
  # Shell scripts
  # ============================================================================
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    args: [--severity=warning]

  # ============================================================================
  # SQL formatting
  # ============================================================================
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 4.2.2
  hooks:
  - id: sqlfluff-lint
    args: [--dialect, sqlite]
    files: \.sql$
    exclude: ^$
  - id: sqlfluff-fix
    args: [--dialect, sqlite, --force]
    files: \.sql$
    exclude: ^$

  # ============================================================================
  # Secrets detection
  # ============================================================================
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args: [--baseline, .secrets.baseline]
    exclude: ^(\.git/|\.venv/|node_modules/|\.next/|htmlcov/|data/feeds(\.enriched)?\.json)$

  # ============================================================================
  # Conventional Commits
  # ============================================================================
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
    args: []

  # ============================================================================
  # Local hooks (project-specific)
  # ============================================================================
- repo: local
  hooks:
    # Python type checking
  - id: ty-smoke
    name: ty (python smoke)
    entry: >-
      bash -lc 'uv run ty check
      apps/cli/ai_web_feeds/cli/commands/enrich.py
      apps/cli/ai_web_feeds/cli/commands/recommend.py
      apps/cli/ai_web_feeds/cli/commands/search.py
      apps/cli/ai_web_feeds/cli/commands/stats.py
      apps/cli/ai_web_feeds/cli/commands/validate.py
      packages/ai_web_feeds/src/ai_web_feeds/analytics.py
      packages/ai_web_feeds/src/ai_web_feeds/load.py
      packages/ai_web_feeds/src/ai_web_feeds/models.py
      packages/ai_web_feeds/src/ai_web_feeds/recommendations.py
      packages/ai_web_feeds/src/ai_web_feeds/utils.py
      packages/ai_web_feeds/src/ai_web_feeds/web_api.py
      packages/ai_web_feeds/src/ai_web_feeds/visualization/cache.py
      packages/ai_web_feeds/src/ai_web_feeds/visualization/models.py
      packages/ai_web_feeds/src/ai_web_feeds/visualization/validators.py'
    language: system
    pass_filenames: false
    always_run: false
    files: ^(apps/cli/ai_web_feeds/cli/commands/(enrich|recommend|search|stats|validate)\.py|packages/ai_web_feeds/src/ai_web_feeds/(analytics|load|models|recommendations|utils|web_api)\.py|packages/ai_web_feeds/src/ai_web_feeds/visualization/(cache|models|validators)\.py)$

    # Python tests
  - id: pytest
    name: pytest (packages smoke)
    entry: >-
      bash -lc 'cd tests &&
      uv run pytest -q
      tests/packages/ai_web_feeds/test_recommendations.py
      tests/packages/ai_web_feeds/test_web_api.py
      tests/packages/ai_web_feeds/unit/test_load.py
      tests/packages/ai_web_feeds/unit/test_models.py
      tests/packages/ai_web_feeds/unit/test_storage.py
      tests/packages/ai_web_feeds/unit/test_validate.py
      tests/packages/test_notifications.py
      tests/packages/test_polling.py
      tests/packages/test_scheduler.py
      tests/packages/test_trending.py
      tests/test_clustering.py
      tests/test_visualization_cache.py
      tests/test_visualization_validators.py'
    language: system
    pass_filenames: false
    always_run: false
    files: ^packages/ai_web_feeds/(src|tests)/.*\.py$

    # Python coverage check
  - id: pytest-cov
    name: pytest smoke coverage
    entry: >-
      bash -lc 'cd tests &&
      uv run pytest -q
      tests/packages/ai_web_feeds/test_recommendations.py
      tests/packages/ai_web_feeds/test_web_api.py
      tests/packages/ai_web_feeds/unit/test_load.py
      tests/packages/ai_web_feeds/unit/test_models.py
      tests/packages/ai_web_feeds/unit/test_storage.py
      tests/packages/ai_web_feeds/unit/test_validate.py
      tests/packages/test_notifications.py
      tests/packages/test_polling.py
      tests/packages/test_scheduler.py
      tests/packages/test_trending.py
      tests/test_clustering.py
      tests/test_visualization_cache.py
      tests/test_visualization_validators.py &&
      uv run coverage report'
    language: system
    pass_filenames: false
    always_run: false
    files: ^packages/ai_web_feeds/(src|tests)/.*\.py$
    stages: [pre-push]

    # TypeScript type checking
  - id: tsc
    name: tsc (apps/web)
    entry: bash -lc 'pnpm --dir apps/web exec tsc --noEmit'
    language: system
    pass_filenames: false
    always_run: false
    files: ^apps/web/.*\.[jt]sx?$

    # ESLint using the app's local config and dependency graph
  - id: eslint-web
    name: eslint (apps/web)
    entry: >-
      bash -lc 'cd apps/web &&
      files=();
      for f in "$@"; do files+=("${f#apps/web/}"); done;
      pnpm exec eslint --fix --max-warnings=0 "${files[@]}"' --
    language: system
    pass_filenames: true
    always_run: false
    files: ^apps/web/.*\.[jt]sx?$

    # Next.js build check (only on push)
  - id: nextjs-build
    name: next build check
    entry: bash -lc 'CI=1 pnpm --dir apps/web build'
    language: system
    pass_filenames: false
    always_run: false
    files: ^apps/web/
    stages: [pre-push]

    # JSON Schema validation
  - id: validate-json-schemas
    name: validate JSON schemas
    entry: bash -c 'uv run python -c "import json; import sys; [json.load(open(f)) for f in sys.argv[1:]]"'
    language: system
    files: \.schema\.json$

    # Data assets validation
  - id: validate-data-assets
    name: validate data assets
    entry: bash -c 'cd data && uv run --project .. python validate_data_assets.py'
    language: system
    pass_filenames: false
    always_run: false
    files: ^data/(feeds|topics)\.(yaml|json|schema\.json)$

# ============================================================================
# CI Configuration
# ============================================================================
ci:
  autofix_commit_msg: |
    fix(ci): auto-fix pre-commit issues

    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: 'chore(deps): update pre-commit hooks'
  autoupdate_schedule: weekly
  skip: [pytest, pytest-cov, tsc, nextjs-build, validate-data-assets, shellcheck, sqlfluff-lint, sqlfluff-fix, detect-secrets]
  submodules: false
