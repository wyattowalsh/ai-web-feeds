[project]
name = "ai-web-feeds-workspace"
version = "0.1.0"
description = "ai-web-feeds workspace root"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai-web-feeds",
    "ai-web-feeds-cli",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "pydantic-settings>=2.11.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.1",
    "detect-secrets>=1.4.0",
    "bandit[toml]>=1.7.10",
    "types-croniter>=6.0.0.20241030",
    "types-PyYAML>=6.0.12.20250915",
    "types-redis>=4.6.0.20241004",
    "types-requests>=2.32.4.20250913",
]

[tool.uv.workspace]
members = [
    "apps/cli",
    "packages/ai_web_feeds",
    "tests",
]

[tool.uv.sources]
ai-web-feeds = { workspace = true }
ai-web-feeds-cli = { workspace = true }

# =======================
# Ruff Configuration
# =======================
[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4

# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "DJ",     # flake8-django
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "INT",    # flake8-gettext
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "TD",     # flake8-todos
    "FIX",    # flake8-fixme
    "ERA",    # eradicate
    "PD",     # pandas-vet
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "NPY",    # numpy-specific rules
    "PERF",   # perflint
    "FURB",   # refurb
    "LOG",    # flake8-logging
    "RUF",    # ruff-specific rules
]

# Ignore specific rules that might be too strict
ignore = [
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicitly concatenated string literals (conflicts with formatter)
    "S101",    # Use of assert detected (allow in tests)
    "PLC0415", # Local imports are used intentionally for optional/heavy deps
    "PLR0912", # Branch count is not a useful repo-wide gate
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Statement count is not a useful repo-wide gate
    "PLR2004", # Magic-value comparisons are too noisy repo-wide
    "PLW0603", # Module-level singleton caches use explicit shared state
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link on TODO
    "FIX002",  # Line contains TODO
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in test files
"tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "ANN",     # Don't require annotations in tests
    "PLR2004", # Allow magic values in tests
    "ARG001",  # Allow unused arguments in test fixtures
    "A006",    # Builtin-shadowing names are acceptable in tests
    "PLC0415", # Local imports are common in tests for optional deps
    "T201",    # Print debugging is acceptable in tests/benchmarks
]
"**/test_*.py" = [
    "S101",
    "ANN",
    "PLR2004",
    "ARG001",
    "A006",
    "PLC0415",
    "T201",
]
# Ignore import errors in __init__.py
"__init__.py" = ["F401", "F403"]
"packages/alembic/**/*.py" = ["ERA001", "INP001"]
# Ignore certain rules in scripts
"**/scripts/**/*.py" = ["INP001", "S607", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["ai_web_feeds", "ai_web_feeds_cli"]
force-single-line = false
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# =======================
# MyPy Configuration
# =======================
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = ["^tests/"]

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "ai_web_feeds.scripts.*",
    "alembic.*",
    "packages.alembic.*",
    "ai_web_feeds.visualization.*",
]
disallow_untyped_defs = false
check_untyped_defs = false
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "type-arg",
    "union-attr",
    "valid-type",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = "cli.commands.*"
disallow_untyped_defs = false
check_untyped_defs = false
disable_error_code = ["import-untyped", "no-any-return"]

[[tool.mypy.overrides]]
module = [
    "ai_web_feeds.analytics",
    "ai_web_feeds.digests",
    "ai_web_feeds.embeddings",
    "ai_web_feeds.enrich",
    "ai_web_feeds.load",
    "ai_web_feeds.migrations.*",
    "ai_web_feeds.nlp.entity_extractor",
    "ai_web_feeds.nlp.jobs.*",
    "ai_web_feeds.nlp.quality_scorer",
    "ai_web_feeds.nlp.sentiment_analyzer",
    "ai_web_feeds.nlp.topic_modeler",
    "ai_web_feeds.polling",
    "ai_web_feeds.recommendations",
    "ai_web_feeds.scheduler",
    "ai_web_feeds.search",
    "ai_web_feeds.storage",
    "ai_web_feeds.trending",
    "ai_web_feeds.utils",
    "ai_web_feeds.validate",
    "ai_web_feeds.web_api",
    "ai_web_feeds.websocket_server",
]
disallow_untyped_defs = false
check_untyped_defs = false
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "call-overload",
    "import-untyped",
    "index",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "operator",
    "return-value",
    "type-arg",
    "union-attr",
    "valid-type",
    "var-annotated",
]

# =======================
# Pytest Configuration
# =======================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=ai_web_feeds",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-ra",
    "-vv",
]
markers = [
    "benchmark: marks performance benchmark tests",
    "database: marks tests requiring database access",
    "e2e: marks tests as end-to-end tests",
    "integration: marks tests as integration tests",
    "network: marks tests requiring network access",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
]

# =======================
# Coverage Configuration
# =======================
[tool.coverage.run]
source = ["src", "apps"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "detect-secrets>=1.5.0",
    "numpy>=2.3.4",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.1.1",
]

[tool.bandit]
exclude_dirs = ["tests"]
