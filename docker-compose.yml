services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: aiwebfeeds_web
    env_file:
    - .env
    environment:
      AIWF_ADMIN_PASSWORD: ${AIWF_ADMIN_PASSWORD:?set AIWF_ADMIN_PASSWORD in .env}
      AIWF_ADMIN_SESSION_SECRET: ${AIWF_ADMIN_SESSION_SECRET:?set AIWF_ADMIN_SESSION_SECRET in .env}
      AIWF_TELEMETRY_DIR: ${AIWF_TELEMETRY_DIR:-/app/data/telemetry}
      BACKEND_URL: ${BACKEND_URL:-}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
    - 3000:3000
    volumes:
    - ./data:/app/data
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
      target: monitor
    container_name: aiwebfeeds_monitor
    env_file:
    - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/ai-web-feeds.db}
      AIWF_JWT_SECRET_KEY: ${AIWF_JWT_SECRET_KEY:-}
      AIWF_TELEMETRY_DIR: ${AIWF_TELEMETRY_DIR:-/app/data/telemetry}
    ports:
    - 8000:8000
    volumes:
    - ./data:/app/data
    restart: unless-stopped
