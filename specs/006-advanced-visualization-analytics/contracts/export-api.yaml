openapi: 3.1.0
info:
  title: AIWebFeeds Export API
  version: 1.0.0
  description: >
    Current runtime export contract for the visualization backend. This file
    mirrors the implemented `/api/v1/export` router rather than older
    planning-only async export job designs.

servers:
- url: /api/v1

security:
- BearerAuth: []
- ApiKeyAuth: []

paths:
  /export/tables:
    get:
      summary: List exportable tables
      operationId: listExportableTables
      tags: [Export]
      responses:
        '200':
          description: Exportable analytics tables and columns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablesResponse'

  /export/data/{table}:
    get:
      summary: Export a table
      operationId: exportTableData
      tags: [Export]
      parameters:
      - $ref: '#/components/parameters/TableName'
      - $ref: '#/components/parameters/ExportFormat'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Export payload in the requested format
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /export/stream/{table}:
    get:
      summary: Stream a table export
      operationId: streamTableExport
      tags: [Export]
      parameters:
      - $ref: '#/components/parameters/TableName'
      - name: format
        in: query
        schema:
          type: string
          enum: [json, csv]
          default: csv
      - name: batch_size
        in: query
        schema:
          type: integer
          default: 1000
          maximum: 5000
      responses:
        '200':
          description: Streaming export response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /export/bulk:
    post:
      summary: Build bulk export URLs
      operationId: bulkExportTables
      tags: [Export]
      parameters:
      - $ref: '#/components/parameters/ExportFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Bulk export URL bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkExportResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    TableName:
      name: table
      in: path
      required: true
      schema:
        type: string
        enum: [topic_metrics, feed_health, article_metadata, validation_logs]
    ExportFormat:
      name: format
      in: query
      schema:
        type: string
        enum: [json, csv, parquet]
        default: json
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 1000
        maximum: 10000
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        nullable: true
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
        nullable: true
    SortOrder:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  schemas:
    TableSummary:
      type: object
      properties:
        description:
          type: string
        columns:
          type: array
          items:
            type: string
      required: [description, columns]

    TablesResponse:
      type: object
      properties:
        tables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TableSummary'
      required: [tables]

    BulkExportResponse:
      type: object
      properties:
        export_id:
          type: string
        tables:
          type: array
          items:
            type: string
        format:
          type: string
          enum: [json, csv, parquet]
        download_urls:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
      required: [export_id, tables, format, download_urls, created_at]

    ValidationErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message]

    ValidationErrorResponse:
      type: object
      properties:
        detail:
          $ref: '#/components/schemas/ValidationErrorDetail'
      required: [detail]
