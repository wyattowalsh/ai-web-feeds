name: Feed Processing Pipeline
on:
  push:
    branches: [main]
    paths:
      - 'data/feeds.yaml'
      - 'data/topics.yaml'
      - 'packages/ai_web_feeds/**'
      - 'apps/cli/**'
  pull_request:
    paths:
      - 'data/feeds.yaml'
      - 'data/topics.yaml'
  workflow_dispatch:
    inputs:
      skip_enrichment:
        description: 'Skip AI enrichment step'
        required: false
        default: true
        type: boolean
      export_formats:
        description: 'Export enriched JSON and OPML artifacts'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  process-feeds:
    name: Process Feed Sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate canonical data assets
        id: validate_assets
        run: uv run python data/validate_data_assets.py

      - name: Process feeds through pipeline
        id: process_pipeline
        run: |
          cd apps/cli
          rm -f ../../data/ai-web-feeds.db
          SKIP_ENRICHMENT=${{ github.event.inputs.skip_enrichment || 'true' }}
          EXPORT_FORMATS=${{ github.event.inputs.export_formats || 'true' }}

          if [ "$SKIP_ENRICHMENT" = "true" ]; then
            ENRICH_FLAG="--skip-enrichment"
          else
            ENRICH_FLAG=""
          fi

          if [ "$EXPORT_FORMATS" = "true" ]; then
            EXPORT_FLAG="--export"
          else
            EXPORT_FLAG="--no-export"
          fi

          uv run ai-web-feeds process \
            --input ../../data/feeds.yaml \
            --output ../../data/feeds.enriched.yaml \
            --database sqlite:///../../data/ai-web-feeds.db \
            $ENRICH_FLAG \
            $EXPORT_FLAG

      - name: Verify outputs
        id: verify_outputs
        run: |
          echo "📊 Verifying generated files..."
          ls -lh data/feeds.enriched.yaml data/feeds.enriched.json data/feeds.enriched.opml data/feeds.enriched.categorized.opml data/ai-web-feeds.db 2>/dev/null || true

          if [ -f data/feeds.enriched.json ]; then
            SOURCES=$(jq '.sources | length' data/feeds.enriched.json)
            echo "✓ feeds.enriched.json: $SOURCES sources"
          fi

          if [ -f data/feeds.enriched.yaml ]; then
            echo "✓ feeds.enriched.yaml generated"
          fi

          if [ -f data/ai-web-feeds.db ]; then
            SIZE=$(stat -f%z data/ai-web-feeds.db 2>/dev/null || stat -c%s data/ai-web-feeds.db)
            echo "✓ ai-web-feeds.db: $SIZE bytes"
          fi

      - name: Check database content
        id: check_database
        run: |
          echo "🔍 Checking database content..."
          sqlite3 data/ai-web-feeds.db ".tables"
          echo ""
          echo "Source count:"
          sqlite3 data/ai-web-feeds.db "SELECT COUNT(*) FROM sources;"
          echo ""
          echo "Sample sources:"
          sqlite3 data/ai-web-feeds.db "SELECT id, title FROM sources LIMIT 5;"

      - name: Write processing summary artifact
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate_assets.outcome }}
          PROCESS_OUTCOME: ${{ steps.process_pipeline.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_outputs.outcome }}
          DATABASE_OUTCOME: ${{ steps.check_database.outcome }}
          SKIP_ENRICHMENT: ${{ github.event.inputs.skip_enrichment || 'true' }}
          EXPORT_FORMATS: ${{ github.event.inputs.export_formats || 'true' }}
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          git add data/feeds.enriched.yaml data/feeds.json data/*.opml data/ai-web-feeds.db || true

          artifact_paths = [
              Path("data/feeds.enriched.yaml"),
              Path("data/feeds.enriched.json"),
              Path("data/feeds.enriched.opml"),
              Path("data/feeds.enriched.categorized.opml"),
              Path("data/ai-web-feeds.db"),
          ]

          source_count = None
          enriched_json_path = Path("data/feeds.enriched.json")
          if enriched_json_path.exists():
              payload = json.loads(enriched_json_path.read_text(encoding="utf-8"))
              source_count = len(payload.get("sources", []))

          summary = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "status": (
                  "success"
                  if os.environ.get("VALIDATE_OUTCOME") == "success"
                  and os.environ.get("PROCESS_OUTCOME") == "success"
                  and os.environ.get("VERIFY_OUTCOME") == "success"
                  and os.environ.get("DATABASE_OUTCOME") == "success"
                  else "failed"
              ),
              "inputs": {
                  "skip_enrichment": os.environ.get("SKIP_ENRICHMENT", "true") == "true",
                  "export_formats": os.environ.get("EXPORT_FORMATS", "true") == "true",
              },
              "steps": {
                  "validate_canonical_data_assets": os.environ.get("VALIDATE_OUTCOME", "skipped"),
                  "process_pipeline": os.environ.get("PROCESS_OUTCOME", "skipped"),
                  "verify_outputs": os.environ.get("VERIFY_OUTCOME", "skipped"),
                  "check_database": os.environ.get("DATABASE_OUTCOME", "skipped"),
              },
              "source_count": source_count,
              "artifacts": [
                  {
                      "path": str(path),
                      "exists": path.exists(),
                      "size_bytes": path.stat().st_size if path.exists() else None,
                  }
                  for path in artifact_paths
              ],
          }

          Path("feed-processing-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Stage processed artifacts
        if: always()
        run: |
          rm -rf processed-feed-artifacts
          mkdir -p processed-feed-artifacts/reports/github/catalog
          if [ -f data/feeds.enriched.yaml ]; then
            cp data/feeds.enriched.yaml processed-feed-artifacts/
          fi
          if [ -f data/feeds.enriched.json ]; then
            cp data/feeds.enriched.json processed-feed-artifacts/
          fi
          if [ -f data/feeds.enriched.opml ]; then
            cp data/feeds.enriched.opml processed-feed-artifacts/
          fi
          if [ -f data/feeds.enriched.categorized.opml ]; then
            cp data/feeds.enriched.categorized.opml processed-feed-artifacts/
          fi
          if [ -f data/ai-web-feeds.db ]; then
            cp data/ai-web-feeds.db processed-feed-artifacts/
          fi
          if [ -f feed-processing-summary.json ]; then
            cp feed-processing-summary.json processed-feed-artifacts/
            cp feed-processing-summary.json \
              processed-feed-artifacts/reports/github/catalog/feed-processing-summary.json
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: processed-feeds
          path: |
            data/feeds.enriched.yaml
            data/feeds.json
            data/*.opml
            data/ai-web-feeds.db
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📊 Feed Processing Results\n\n';

            if (fs.existsSync('data/feeds.enriched.json')) {
              const data = JSON.parse(fs.readFileSync('data/feeds.enriched.json', 'utf8'));
              const sourceCount = data.sources?.length || 0;
              comment += `✅ Successfully processed **${sourceCount}** feed sources\n\n`;
            }

            comment += '### Generated Files\n';
            const files = ['feeds.enriched.yaml', 'feeds.json', 'feeds.opml', 'feeds.categorized.opml', 'ai-web-feeds.db'];
            for (const file of files) {
              const path = `data/${file}`;
              if (fs.existsSync(path)) {
                const stats = fs.statSync(path);
                const size = (stats.size / 1024).toFixed(2);
                comment += `- ✓ \`${file}\` (${size} KB)\n`;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

  commit-processed:
    name: Commit Processed Outputs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: process-feeds
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download processed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: processed-feeds
          path: processed-feed-artifacts

      - name: Restore processed artifacts into data/
        run: |
          mkdir -p data
          if [ -f processed-feed-artifacts/feeds.enriched.yaml ]; then
            cp processed-feed-artifacts/feeds.enriched.yaml data/feeds.enriched.yaml
          fi
          if [ -f processed-feed-artifacts/feeds.enriched.json ]; then
            cp processed-feed-artifacts/feeds.enriched.json data/feeds.enriched.json
          fi
          if [ -f processed-feed-artifacts/feeds.enriched.opml ]; then
            cp processed-feed-artifacts/feeds.enriched.opml data/feeds.enriched.opml
          fi
          if [ -f processed-feed-artifacts/feeds.enriched.categorized.opml ]; then
            cp processed-feed-artifacts/feeds.enriched.categorized.opml data/feeds.enriched.categorized.opml
          fi
          if [ -f processed-feed-artifacts/ai-web-feeds.db ]; then
            cp processed-feed-artifacts/ai-web-feeds.db data/ai-web-feeds.db
          fi
          mkdir -p reports/github/catalog
          if [ -f processed-feed-artifacts/reports/github/catalog/feed-processing-summary.json ]; then
            cp processed-feed-artifacts/reports/github/catalog/feed-processing-summary.json \
              reports/github/catalog/feed-processing-summary.json
          elif [ -f processed-feed-artifacts/feed-processing-summary.json ]; then
            cp processed-feed-artifacts/feed-processing-summary.json \
              reports/github/catalog/feed-processing-summary.json
          fi

      - name: Commit processed files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/feeds.enriched.yaml data/feeds.enriched.json data/feeds.enriched.opml data/feeds.enriched.categorized.opml data/ai-web-feeds.db || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update processed feed data [skip ci]"
            git push
          fi
