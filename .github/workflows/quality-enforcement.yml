name: Quality Enforcement (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-quality-gate:
    name: Legacy Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run quality checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy packages/ai_web_feeds/src apps/cli/ai_web_feeds --config-file=pyproject.toml
          cd tests && uv run pytest -q
