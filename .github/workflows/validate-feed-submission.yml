name: Validate Feed Submission
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

jobs:
  validate-feed:
    if: contains(github.event.issue.labels.*.name, 'feed-submission')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        uses: astral-sh/setup-uv@e9d0d9a1a81cd4e8ceef21e0eb11f15b4be0e5f0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Normalize issue submission
        id: normalize_submission
        run: |
          uv run python .github/scripts/feed_submission_to_source.py \
            --event-path "${GITHUB_EVENT_PATH}" \
            --output-source parsed_feed.json \
            --output-summary parsed_feed_summary.md

      - name: Check duplicate source URL
        id: duplicate_check
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          parsed = json.loads(Path("parsed_feed.json").read_text(encoding="utf-8"))
          candidate_url = parsed["url"].rstrip("/")
          feeds = yaml.safe_load(Path("data/feeds.yaml").read_text(encoding="utf-8")) or {}
          sources = feeds.get("sources", [])
          for source in sources:
              url = source.get("url")
              if isinstance(url, str) and url.rstrip("/") == candidate_url:
                  raise SystemExit(f"Duplicate source URL already exists: {candidate_url}")
          print(f"No duplicate URL found for {candidate_url}")
          PY

      - name: Validate repository data assets
        id: validate_assets
        run: uv run python data/validate_data_assets.py

      - name: Write validation summary artifact
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          NORMALIZE_OUTCOME: ${{ steps.normalize_submission.outcome }}
          DUPLICATE_OUTCOME: ${{ steps.duplicate_check.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_assets.outcome }}
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          normalize_outcome = os.environ.get("NORMALIZE_OUTCOME", "skipped")
          duplicate_outcome = os.environ.get("DUPLICATE_OUTCOME", "skipped")
          validate_outcome = os.environ.get("VALIDATE_OUTCOME", "skipped")

          summary = {
              "issue_number": int(os.environ["ISSUE_NUMBER"]) if os.environ.get("ISSUE_NUMBER") else None,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "status": (
                  "validated"
                  if normalize_outcome == "success"
                  and duplicate_outcome == "success"
                  and validate_outcome == "success"
                  else "validation-failed"
              ),
              "steps": {
                  "normalize_submission": normalize_outcome,
                  "duplicate_check": duplicate_outcome,
                  "validate_repository_data_assets": validate_outcome,
              },
              "artifacts": {
                  "parsed_feed_json": Path("parsed_feed.json").exists(),
                  "parsed_feed_summary_md": Path("parsed_feed_summary.md").exists(),
              },
              "normalized_source": None,
              "summary_markdown": None,
          }

          parsed_feed_path = Path("parsed_feed.json")
          if parsed_feed_path.exists():
              summary["normalized_source"] = json.loads(parsed_feed_path.read_text(encoding="utf-8"))

          parsed_summary_path = Path("parsed_feed_summary.md")
          if parsed_summary_path.exists():
              summary["summary_markdown"] = parsed_summary_path.read_text(encoding="utf-8")

          Path("feed-submission-validation-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Stage issue-scoped validation evidence
        if: always()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          NORMALIZE_OUTCOME: ${{ steps.normalize_submission.outcome }}
          DUPLICATE_OUTCOME: ${{ steps.duplicate_check.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_assets.outcome }}
        run: |
          ISSUE_ARTIFACT_DIR="reports/github/feed-submissions/issue-${ISSUE_NUMBER}"
          mkdir -p "${ISSUE_ARTIFACT_DIR}"

          if [ -f parsed_feed.json ]; then
            cp parsed_feed.json "${ISSUE_ARTIFACT_DIR}/normalized-source.json"
          fi
          if [ -f parsed_feed_summary.md ]; then
            cp parsed_feed_summary.md "${ISSUE_ARTIFACT_DIR}/validation-summary.md"
          fi
          if [ -f feed-submission-validation-summary.json ]; then
            cp feed-submission-validation-summary.json \
              "${ISSUE_ARTIFACT_DIR}/feed-submission-validation-summary.json"
          fi

          uv run python - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          issue_number = os.environ.get("ISSUE_NUMBER")
          issue_artifact_dir = Path("reports/github/feed-submissions") / f"issue-{issue_number}"
          manifest = {
              "issue_number": int(issue_number) if issue_number else None,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "steps": {
                  "normalize_submission": os.environ.get("NORMALIZE_OUTCOME", "skipped"),
                  "duplicate_check": os.environ.get("DUPLICATE_OUTCOME", "skipped"),
                  "validate_repository_data_assets": os.environ.get("VALIDATE_OUTCOME", "skipped"),
              },
              "artifacts": {
                  "normalized_source_json": (issue_artifact_dir / "normalized-source.json").exists(),
                  "validation_summary_md": (issue_artifact_dir / "validation-summary.md").exists(),
                  "validation_summary_json": (
                      issue_artifact_dir / "feed-submission-validation-summary.json"
                  ).exists(),
              },
          }
          (issue_artifact_dir / "snapshot-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload validation summary artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed-submission-validation-summary
          path: feed-submission-validation-summary.json
          retention-days: 30

      - name: Upload issue-scoped validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed-submission-evidence-issue-${{ github.event.issue.number }}
          path: reports/github/feed-submissions/issue-${{ github.event.issue.number }}/
          retention-days: 30

      - name: Post validation status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const marker = '<!-- ai-web-feeds:validation -->';
            const snapshotMarker = '<!-- ai-web-feeds:validated-source ';
            const success = '${{ job.status }}' === 'success';
            const summary = fs.existsSync('parsed_feed_summary.md')
              ? fs.readFileSync('parsed_feed_summary.md', 'utf8')
              : 'Could not parse submission details.';
            const trustBoundary = 'Automation is additive: maintainers must approve a validated snapshot, and approval opens a reviewable pull request instead of mutating `main` directly.';

            let snapshotDetails = '';
            if (success && fs.existsSync('parsed_feed.json')) {
              const parsed = JSON.parse(fs.readFileSync('parsed_feed.json', 'utf8'));
              const bodyHash = crypto
                .createHash('sha256')
                .update(context.payload.issue?.body || '')
                .digest('hex');
              const encodedSnapshot = Buffer.from(
                JSON.stringify({ body_sha256: bodyHash, source: parsed }),
                'utf8',
              ).toString('base64');
              snapshotDetails = `\n<details>\n<summary>Validated source snapshot</summary>\n\n\`\`\`json\n${JSON.stringify(parsed, null, 2)}\n\`\`\`\n</details>\n\n${snapshotMarker}${encodedSnapshot} -->`;
            }

            const message = success
              ? `✅ **Validation Passed**\n\n${summary}\n\nSubmission is ready for maintainer review.${snapshotDetails}\n\n---\n\n${trustBoundary}`
              : `❌ **Validation Failed**\n\n${summary}\n\nPlease correct the submission fields and run validation again.\n\n---\n\n${trustBoundary}`;

            const issueParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };

            for (const label of success ? ['validation-failed', 'status/needs-info'] : ['validated', 'status/needs-review', 'approved']) {
              try {
                await github.rest.issues.removeLabel({ ...issueParams, name: label });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              ...issueParams,
              labels: success ? ['validated', 'status/needs-review'] : ['validation-failed', 'status/needs-info'],
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issueParams,
              per_page: 100,
            });
            const existing = [...comments].reverse().find(
              (comment) => comment.body?.includes(marker) && comment.user?.login?.endsWith('[bot]'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n${message}`,
              });
            } else {
              await github.rest.issues.createComment({
                ...issueParams,
                body: `${marker}\n${message}`,
              });
            }
