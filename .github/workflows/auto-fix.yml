name: Auto-fix Code Issues

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    name: Auto-fix with Ruff
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@e9d0d9a1a81cd4e8ceef21e0eb11f15b4be0e5f0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run auto-fix via uv scripts
        run: uv run fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_changes=true"
              echo "changed_files<<EOF"
              git diff --name-only
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: auto-fix code with ruff [skip ci]"
          git push

      - name: Comment on PR
        if: steps.verify-changed-files.outputs.has_changes == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const changedFiles = `${{ steps.verify-changed-files.outputs.changed_files }}`;
            const message = `🤖 **Auto-fixed code formatting and linting issues**

            Fixed files:
            \`\`\`
            ${changedFiles}
            \`\`\`

            Changes applied:
            - ✅ Ruff linting auto-fixes
            - ✅ Code formatting (ruff format)

            *Committed by GitHub Actions*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
