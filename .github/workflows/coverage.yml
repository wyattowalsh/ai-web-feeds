name: Coverage Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          cd tests
          uv run pytest -q \
            tests/packages/ai_web_feeds/test_recommendations.py \
            tests/packages/ai_web_feeds/test_web_api.py \
            tests/packages/ai_web_feeds/unit/test_load.py \
            tests/packages/ai_web_feeds/unit/test_models.py \
            tests/packages/ai_web_feeds/unit/test_storage.py \
            tests/packages/ai_web_feeds/unit/test_validate.py \
            tests/packages/ai_web_feeds/unit/test_articles.py \
            tests/packages/ai_web_feeds/unit/test_catalog_sync_mapper.py \
            tests/packages/ai_web_feeds/unit/test_catalog_sync_stages.py \
            tests/cli/unit/test_process_catalog_sync.py \
            tests/packages/test_notifications.py \
            tests/packages/test_polling.py \
            tests/packages/test_scheduler.py \
            tests/packages/test_trending.py \
            tests/test_clustering.py \
            tests/test_visualization_cache.py \
            tests/test_visualization_validators.py
          uv run coverage xml -o reports/coverage/coverage.xml

      - name: Generate coverage summary
        run: |
          cd tests
          uv run coverage report
          uv run coverage report --format=markdown > ../coverage-summary.md

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            tests/reports/coverage/
            coverage-summary.md
          retention-days: 30
