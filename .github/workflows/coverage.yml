name: Coverage Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e9d0d9a1a81cd4e8ceef21e0eb11f15b4be0e5f0
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318458e6f4ee6ba0924cf52375e
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          cd tests
          uv run pytest -q \
            tests/packages/ai_web_feeds/test_recommendations.py \
            tests/packages/ai_web_feeds/test_web_api.py \
            tests/packages/ai_web_feeds/unit/test_load.py \
            tests/packages/ai_web_feeds/unit/test_models.py \
            tests/packages/ai_web_feeds/unit/test_storage.py \
            tests/packages/ai_web_feeds/unit/test_validate.py \
            tests/packages/test_notifications.py \
            tests/packages/test_polling.py \
            tests/packages/test_scheduler.py \
            tests/packages/test_trending.py \
            tests/test_clustering.py \
            tests/test_visualization_cache.py \
            tests/test_visualization_validators.py
          uv run coverage xml -o reports/coverage/coverage.xml

      - name: Generate coverage summary
        run: |
          cd tests
          uv run coverage report
          uv run coverage report --format=markdown > ../coverage-summary.md

      - name: Upload coverage reports
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35165aba89db6baf
        with:
          name: coverage-reports
          path: |
            tests/reports/coverage/
            coverage-summary.md
          retention-days: 30
