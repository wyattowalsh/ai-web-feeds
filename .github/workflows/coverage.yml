name: Coverage Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest

      - name: Generate coverage summary
        run: |
          uv run coverage report
          uv run coverage report --format=markdown > coverage-summary.md

      # Unfiltered root line-rate. Fail only when it drops more than 0.5 points below 0.6037.
      - name: Check coverage line-rate baseline
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from decimal import Decimal
          from pathlib import Path

          baseline = Decimal("0.6037")
          floor = Decimal("0.5987")
          xml_path = Path("coverage.xml")
          if not xml_path.is_file():
              print(f"coverage XML not found: {xml_path}", file=sys.stderr)
              sys.exit(1)
          line_rate = Decimal(ET.parse(xml_path).getroot().attrib["line-rate"])
          print(f"unfiltered line-rate={line_rate} baseline={baseline} floor={floor}")
          if line_rate < floor:
              print(
                  f"line-rate {line_rate} dropped more than 0.5 points below {baseline}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
            coverage-summary.md
          retention-days: 30
