name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-checks:
    name: Pre-release Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@e16496da15ae13d37b4bd94bd25447904da7fc5a

      - name: Install uv
        uses: astral-sh/setup-uv@e9d0d9a1a81cd4e8ceef21e0eb11f15b4be0e5f0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318458e6f4ee6ba0924cf52375e
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run all checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy packages/ai_web_feeds/src apps/cli/ai_web_feeds
          uv run pytest --cov

  build-and-publish:
    name: Build & Publish
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for PyPI trusted publishing via GitHub OIDC.

    steps:
      - name: Checkout code
        uses: actions/checkout@e16496da15ae13d37b4bd94bd25447904da7fc5a
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@e9d0d9a1a81cd4e8ceef21e0eb11f15b4be0e5f0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318458e6f4ee6ba0924cf52375e
        with:
          python-version: '3.13'

      - name: Build packages
        run: |
          cd packages/ai_web_feeds
          uv build
          cd ../../apps/cli
          uv build

      - name: Note tag requirement for publishing
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::notice::workflow_dispatch validates and builds release artifacts only."
          echo "::notice::PyPI publishing and GitHub release creation still require a v*.*.* tag ref."

      # Trusted publishing relies on GitHub OIDC and repository-side PyPI trust
      # configuration. These steps only run for tag refs.
      - name: Publish to PyPI (ai_web_feeds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: packages/ai_web_feeds/dist

      - name: Publish to PyPI (ai_web_feeds_cli)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: apps/cli/dist

      # Keep the exact built distributions even if publish fails so maintainers can
      # inspect or retry with the same payload.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35165aba89db6baf
        with:
          name: dist-packages
          path: |
            packages/ai_web_feeds/dist/*
            apps/cli/dist/*
          retention-days: 30
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@e16496da15ae13d37b4bd94bd25447904da7fc5a
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-packages
          path: dist/

      - name: Generate release notes
        id: release-notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Get commits since last tag
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi

          cat > release_notes.md << EOF
          ## What's Changed

          $COMMITS

          ## Installation

          \`\`\`bash
          uv add ai-web-feeds==$VERSION
          uv add ai-web-feeds-cli==$VERSION
          \`\`\`

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.release-notes.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
