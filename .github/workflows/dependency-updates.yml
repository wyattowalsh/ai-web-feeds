name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-latest
    env:
      PR_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN != '' && secrets.GH_AW_CI_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@e16496da15ae13d37b4bd94bd25447904da7fc5a

      - name: Install uv
        uses: astral-sh/setup-uv@e9d0d9a1a81cd4e8ceef21e0eb11f15b4be0e5f0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318458e6f4ee6ba0924cf52375e
        with:
          python-version: '3.13'

      - name: Update dependencies
        run: |
          uv lock --upgrade

      - name: Create Pull Request
        id: create_pr_dependencies
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        continue-on-error: true
        with:
          token: ${{ env.PR_TOKEN }}
          commit-message: 'chore: update Python dependencies'
          title: '🔄 Update Python Dependencies'
          body: |
            ## Dependency Updates

            This PR updates Python dependencies to their latest compatible versions.

            ### Changes
            - Updated `uv.lock` with latest package versions

            ### Testing
            - [ ] All tests pass
            - [ ] No breaking changes detected

            **Auto-generated by GitHub Actions** 🤖
          branch: chore/update-dependencies
          delete-branch: true
          add-paths: |
            uv.lock
          labels: |
            dependencies
            automated

      - name: Report PR creation failure
        if: steps.create_pr_dependencies.outcome == 'failure'
        run: |
          echo "::warning::Dependency update PR creation failed (permissions/policy)."
          echo "::warning::Set GH_AW_CI_TRIGGER_TOKEN or allow bot PR creation."

  update-pre-commit:
    name: Update Pre-commit Hooks
    runs-on: ubuntu-latest
    env:
      PR_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN != '' && secrets.GH_AW_CI_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@e16496da15ae13d37b4bd94bd25447904da7fc5a

      - name: Install uv
        uses: astral-sh/setup-uv@e9d0d9a1a81cd4e8ceef21e0eb11f15b4be0e5f0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318458e6f4ee6ba0924cf52375e
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Update pre-commit hooks
        run: uv run pre-commit autoupdate

      - name: Create Pull Request
        id: create_pr_precommit
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        continue-on-error: true
        with:
          token: ${{ env.PR_TOKEN }}
          commit-message: 'chore: update pre-commit hooks'
          title: '🔄 Update Pre-commit Hooks'
          body: |
            ## Pre-commit Hook Updates

            This PR updates pre-commit hooks to their latest versions.

            ### Changes
            - Updated `.pre-commit-config.yaml` with latest hook versions

            **Auto-generated by GitHub Actions** 🤖
          branch: chore/update-pre-commit-hooks
          delete-branch: true
          add-paths: |
            .pre-commit-config.yaml
          labels: |
            dependencies
            automated

      - name: Report PR creation failure
        if: steps.create_pr_precommit.outcome == 'failure'
        run: |
          echo "::warning::Pre-commit update PR creation failed (permissions/policy)."
          echo "::warning::Set GH_AW_CI_TRIGGER_TOKEN or allow bot PR creation."
