name: Data Submission Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "data/feeds.yaml"
      - "data/feeds.enriched.yaml"
      - "data/topics.yaml"
      - "data/*.schema.json"
      - "data/validate_data_assets.py"

permissions:
  contents: read

jobs:
  validate-data:
    name: Validate Data Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate data assets
        run: uv run python data/validate_data_assets.py
