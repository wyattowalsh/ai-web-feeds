name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Ruff lint
        run: |
          uv run ruff check \
            apps/cli/ai_web_feeds/cli/commands/enrich.py \
            apps/cli/ai_web_feeds/cli/commands/recommend.py \
            apps/cli/ai_web_feeds/cli/commands/search.py \
            apps/cli/ai_web_feeds/cli/commands/stats.py \
            apps/cli/ai_web_feeds/cli/commands/validate.py \
            packages/ai_web_feeds/src/ai_web_feeds/analytics.py \
            packages/ai_web_feeds/src/ai_web_feeds/load.py \
            packages/ai_web_feeds/src/ai_web_feeds/models.py \
            packages/ai_web_feeds/src/ai_web_feeds/recommendations.py \
            packages/ai_web_feeds/src/ai_web_feeds/utils.py \
            packages/ai_web_feeds/src/ai_web_feeds/web_api.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/cache.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/models.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/validators.py

      - name: Check Ruff formatting
        run: |
          uv run ruff format --check \
            apps/cli/ai_web_feeds/cli/commands/enrich.py \
            apps/cli/ai_web_feeds/cli/commands/recommend.py \
            apps/cli/ai_web_feeds/cli/commands/search.py \
            apps/cli/ai_web_feeds/cli/commands/stats.py \
            apps/cli/ai_web_feeds/cli/commands/validate.py \
            packages/ai_web_feeds/src/ai_web_feeds/analytics.py \
            packages/ai_web_feeds/src/ai_web_feeds/load.py \
            packages/ai_web_feeds/src/ai_web_feeds/models.py \
            packages/ai_web_feeds/src/ai_web_feeds/recommendations.py \
            packages/ai_web_feeds/src/ai_web_feeds/utils.py \
            packages/ai_web_feeds/src/ai_web_feeds/web_api.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/cache.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/models.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/validators.py

      - name: Run mypy smoke
        run: |
          uv run pre-commit run mypy --files \
            packages/ai_web_feeds/src/ai_web_feeds/analytics.py \
            packages/ai_web_feeds/src/ai_web_feeds/load.py \
            packages/ai_web_feeds/src/ai_web_feeds/models.py \
            packages/ai_web_feeds/src/ai_web_feeds/recommendations.py \
            packages/ai_web_feeds/src/ai_web_feeds/utils.py \
            packages/ai_web_feeds/src/ai_web_feeds/web_api.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/cache.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/models.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/validators.py

      - name: Run Bandit
        run: |
          uv run bandit \
            apps/cli/ai_web_feeds/cli/commands/enrich.py \
            apps/cli/ai_web_feeds/cli/commands/recommend.py \
            apps/cli/ai_web_feeds/cli/commands/search.py \
            apps/cli/ai_web_feeds/cli/commands/stats.py \
            apps/cli/ai_web_feeds/cli/commands/validate.py \
            packages/ai_web_feeds/src/ai_web_feeds/analytics.py \
            packages/ai_web_feeds/src/ai_web_feeds/load.py \
            packages/ai_web_feeds/src/ai_web_feeds/models.py \
            packages/ai_web_feeds/src/ai_web_feeds/recommendations.py \
            packages/ai_web_feeds/src/ai_web_feeds/utils.py \
            packages/ai_web_feeds/src/ai_web_feeds/web_api.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/cache.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/models.py \
            packages/ai_web_feeds/src/ai_web_feeds/visualization/validators.py \
            -c pyproject.toml

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pytest smoke
        run: |
          cd tests
          uv run pytest -q \
            tests/packages/ai_web_feeds/test_recommendations.py \
            tests/packages/ai_web_feeds/test_web_api.py \
            tests/packages/ai_web_feeds/unit/test_load.py \
            tests/packages/ai_web_feeds/unit/test_models.py \
            tests/packages/ai_web_feeds/unit/test_storage.py \
            tests/packages/ai_web_feeds/unit/test_validate.py \
            tests/packages/test_notifications.py \
            tests/packages/test_polling.py \
            tests/packages/test_scheduler.py \
            tests/packages/test_trending.py \
            tests/test_clustering.py \
            tests/test_visualization_cache.py \
            tests/test_visualization_validators.py

  web-quality:
    name: Web Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --dir apps/web lint

      - name: Generate Next.js route types
        run: pnpm --dir apps/web exec next typegen

      - name: Run TypeScript
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Run unit tests
        run: pnpm --dir apps/web test:unit

      - name: Build app
        run: CI=1 pnpm --dir apps/web build

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [web-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir apps/web exec playwright install --with-deps

      - name: Run Playwright
        run: pnpm --dir apps/web test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
