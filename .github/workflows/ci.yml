name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  # Backend tests
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aiwebfeeds_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@e16496da15ae13d37b4bd94bd25447904da7fc5a

      - name: Set up Python 3.13
        uses: actions/setup-python@0b93645e9fea7318458e6f4ee6ba0924cf52375e
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@e9d0d9a1a81cd4e8ceef21e0eb11f15b4be0e5f0

      - name: Install dependencies
        run: cd packages/ai_web_feeds && uv sync

      - name: Run migrations
        run: |
          cd packages
          mkdir -p "${GITHUB_WORKSPACE}/.ci"
          uv run python - <<'PY'
          import os
          from pathlib import Path

          ini_path = Path("alembic.ini")
          database_url = os.environ["DATABASE_URL"]
          lines = ini_path.read_text(encoding="utf-8").splitlines()
          updated = [
              f"sqlalchemy.url = {database_url}" if line.startswith("sqlalchemy.url =") else line
              for line in lines
          ]
          ini_path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY
          uv run alembic upgrade heads
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/.ci/aiwebfeeds.db

      - name: Run tests
        run: cd tests && uv run pytest --cov --cov-report=xml
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/.ci/aiwebfeeds.db
          REDIS_URL: redis://localhost:6379/0

      - name: Upload coverage
        uses: codecov/codecov-action@4fee8191a9b83f4a92b8d31bbdfe36e4c6abbc3a
        with:
          files: ./coverage.xml

  # Frontend tests
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@e16496da15ae13d37b4bd94bd25447904da7fc5a

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d41e51769a0648c87d3d66e5209
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Lint
        run: cd apps/web && pnpm lint

      - name: Type check
        run: cd apps/web && pnpm tsc --noEmit

      - name: Build
        run: cd apps/web && pnpm build

  # E2E tests
  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@e16496da15ae13d37b4bd94bd25447904da7fc5a

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d41e51769a0648c87d3d66e5209
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Install Playwright
        run: ./apps/web/node_modules/.bin/playwright install --with-deps

      - name: Run E2E tests
        run: ./apps/web/node_modules/.bin/playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35165aba89db6baf
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b274fc6134d1d699
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@0ba333c46717850d055f33e33de43640e8a3e639
        with:
          sarif_file: "trivy-results.sarif"

  # Build and push Docker image
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa601d98477e57

      - name: Login to Docker Hub
        id: docker-creds
        run: |
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PASSWORD}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker credentials not configured; skipping docker build/push."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Docker Hub
        if: steps.docker-creds.outputs.available == 'true'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a9
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push
        if: steps.docker-creds.outputs.available == 'true'
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56
        with:
          context: .
          push: true
          tags: |
            aiwebfeeds/visualization:latest
            aiwebfeeds/visualization:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to production
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add deployment commands here
          # e.g., kubectl apply, terraform apply, etc.
