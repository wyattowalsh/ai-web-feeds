name: 🔖 Add New Feed
description: Submit a new AI/ML feed or source URL to the registry
title: "[Feed]: "
labels: ["feed-submission", "status/needs-review"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Add a New AI/ML Feed

        Thanks for contributing to AI Web Feeds.

        The live automation only consumes:

        - one source URL (`Feed URL` or `Website URL`)
        - 1–6 canonical topics
        - an optional title
        - optional notes for maintainers

        Everything else stays in maintainer review or later enrichment steps.

        ### What happens next?

        1. ✅ The issue form is normalized into a minimal canonical source snapshot.
        2. ✅ Automation validates the selected topic IDs and schema shape.
        3. 🔍 Maintainers review the validated snapshot.
        4. ✨ If approved, automation opens a **pull request** that appends the validated snapshot to `data/feeds.yaml`.

        ### Before submitting

        If you want to double-check that a source is not already present:

        ```bash
        git clone https://github.com/wyattowalsh/ai-web-feeds.git
        cd ai-web-feeds
        uv sync
        rg "example.com|Example Feed" data/feeds.yaml
        ```

        Prefer the direct feed URL when you know it. If you only know the website, provide the website URL and maintainers can review discovery from there.

  - type: input
    id: feed_url
    attributes:
      label: Feed URL
      description: Direct RSS, Atom, or JSON Feed URL (preferred when known).
      placeholder: "https://example.com/feed.xml"
    validations:
      required: false

  - type: input
    id: site_url
    attributes:
      label: Website URL
      description: Website or publication homepage when a direct feed URL is not available.
      placeholder: "https://example.com/blog"
    validations:
      required: false

  - type: input
    id: title
    attributes:
      label: Feed Title
      description: Optional human-readable title override. Leave blank if the source title should be auto-enriched.
      placeholder: "Example Feed"
    validations:
      required: false

  - type: checkboxes
    id: topics
    attributes:
      label: Topics
      description: Select 1–6 canonical topic IDs from `data/topics.yaml`.
      options:
        - label: "Artificial Intelligence (ai)"
        - label: "Machine Learning (ml)"
        - label: "Generative AI (genai)"
        - label: "Natural Language Processing (nlp)"
        - label: "Large Language Models (llm)"
        - label: "Computer Vision (cv)"
        - label: "Agents (agents)"
        - label: "Evaluation (evaluation)"
        - label: "Retrieval (retrieval)"
        - label: "Embeddings (embeddings)"
        - label: "Training (training)"
        - label: "Inference (inference)"
        - label: "Optimization (optimization)"
        - label: "ML Compilers (compilers)"
        - label: "MLOps (mlops)"
        - label: "Research (research)"
        - label: "Industry (industry)"
        - label: "Safety (safety)"
        - label: "Open Source (open-source)"
        - label: "Data Engineering (data)"
        - label: "Education (education)"
        - label: "Product (product)"
        - label: "Community (community)"
        - label: "Blogs (blogs)"
        - label: "Newsletters (newsletters)"
        - label: "Podcasts (podcasts)"

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Optional context for maintainers (quality, cadence, source authority, special handling, etc.).
      placeholder: "This source is maintained by..."
    validations:
      required: false

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: Please confirm the following before submitting.
      options:
        - label: "I verified that the source is currently reachable."
          required: true
        - label: "I checked that this source is not already listed in `data/feeds.yaml`."
          required: true
        - label: "This source regularly publishes AI/ML-relevant content."
          required: true

  - type: markdown
    attributes:
      value: |
        ---

        ### Need help?

        - 📖 [Feed Schema Documentation](https://aiwebfeeds.com/docs/guides/feed-schema)
        - 🔄 [GitHub Workflow Docs](https://aiwebfeeds.com/docs/development/workflows)
        - 🏗️ [GitHub Infrastructure Guide](https://aiwebfeeds.com/docs/guides/github-infrastructure)

        Thanks for helping improve AI Web Feeds! 🎉
