name: 🛠️ CLI Issue
description: Report a problem with the ai-web-feeds command-line interface
title: "[CLI]: "
labels: ["component/cli", "status/needs-review"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## CLI Issue Report

        Report bugs, rough edges, or feature requests for the `ai-web-feeds` command-line interface.

        ### Before reporting

        1. Update your checkout:
           ```bash
           git pull origin main
           uv sync
           ```
        2. Re-run the failing command with debug logging:
           ```bash
           AIWF_LOGGING__LEVEL=DEBUG uv run ai-web-feeds <command>
           ```
        3. Review command help:
           ```bash
           uv run ai-web-feeds --help
           uv run ai-web-feeds <command> --help
           ```
        4. Review the docs:
           - [CLI Guide](https://aiwebfeeds.com/docs/development/cli)
           - [CLI Workflow Integration](https://aiwebfeeds.com/docs/development/cli-workflows)
           - [Getting Started Troubleshooting](https://aiwebfeeds.com/docs/guides/getting-started#troubleshooting)

        The canonical entry point is `ai-web-feeds`. The legacy `aiwebfeeds` alias is still supported, but new examples should prefer the canonical command.

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      description: What kind of CLI issue is this?
      options:
        - "Bug - command fails or crashes"
        - "Unexpected output or UX"
        - "Docs or help text is incorrect"
        - "Performance issue"
        - "Feature request"
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Command
      description: Which CLI command is affected?
      options:
        - "process"
        - "load"
        - "validate"
        - "enrich"
        - "export"
        - "analytics"
        - "search"
        - "recommend"
        - "monitor"
        - "nlp"
        - "Multiple commands"
        - "General CLI"
    validations:
      required: true

  - type: textarea
    id: command_run
    attributes:
      label: Command Executed
      description: Paste the exact command you ran, including any environment variables.
      placeholder: |
        cd /path/to/ai-web-feeds
        AIWF_LOGGING__LEVEL=DEBUG uv run ai-web-feeds validate data/feeds.yaml
      render: bash
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Command Output
      description: Paste the complete stdout/stderr output, including the exit code if possible.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect the command to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of the commands below.
      placeholder: |
        uv --version
        uv run python --version
        uv run python -c "import ai_web_feeds; print(ai_web_feeds.__version__)"
        uname -a
      render: shell
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - "Always"
        - "Frequently"
        - "Sometimes"
        - "Rarely"
        - "Only once"
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if any)
      description: Describe any workaround you found.
    validations:
      required: false

  - type: checkboxes
    id: debugging
    attributes:
      label: Debugging Attempted
      description: What have you already tried?
      options:
        - label: "Re-ran with `AIWF_LOGGING__LEVEL=DEBUG`"
        - label: "Checked `uv run ai-web-feeds --help`"
        - label: "Updated with `uv sync`"
        - label: "Tested against a minimal example"
        - label: "Checked the linked docs"

  - type: textarea
    id: feature_request
    attributes:
      label: Feature Request Details (if applicable)
      description: If this is a feature request, describe the desired command, option, or output shape.
      render: markdown
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Include related issues, screenshots, or other helpful details.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ### Helpful references

        - [CLI Guide](https://aiwebfeeds.com/docs/development/cli)
        - [CLI Workflow Integration](https://aiwebfeeds.com/docs/development/cli-workflows)
        - [Python API Reference](https://aiwebfeeds.com/docs/development/python-api)

        CLI code lives in:

        - `apps/cli/ai_web_feeds/cli/commands/`
        - `apps/cli/ai_web_feeds/cli/__init__.py`
        - `packages/ai_web_feeds/src/ai_web_feeds/`

        Thanks for helping improve the CLI! 🚀
