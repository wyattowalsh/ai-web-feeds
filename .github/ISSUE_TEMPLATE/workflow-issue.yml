name: 🔄 Workflow/CI Issue
description: Report a problem with GitHub Actions workflows or automation behavior
title: "[Workflow]: "
labels: ["component/ci-cd", "status/needs-review"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Workflow or CI Issue

        Report issues with GitHub Actions workflows, CI/CD pipelines, or repository automation.

        ### Quick debugging checklist

        1. Check the [workflow logs](https://github.com/wyattowalsh/ai-web-feeds/actions).
        2. Re-run the failed job if the failure looks transient.
        3. Re-run the exact command locally when possible:
           ```bash
           uv run python data/validate_data_assets.py
           uv run ai-web-feeds process --input data/feeds.yaml --output data/feeds.enriched.yaml
           cd apps/web && pnpm lint
           ```
        4. Review the docs:
           - [Workflow Docs](https://aiwebfeeds.com/docs/development/workflows)
           - [GitHub Infrastructure](https://aiwebfeeds.com/docs/guides/github-infrastructure)
           - [Workflow Troubleshooting](https://aiwebfeeds.com/docs/guides/github-infrastructure#troubleshooting)

        Repository automation is intentionally narrow: issue-driven feed intake should validate first, use maintainer-controlled approval, and mutate the repo only through reviewable pull requests.

  - type: dropdown
    id: workflow_file
    attributes:
      label: Workflow File
      description: Which workflow is affected?
      options:
        - "validate-feed-submission.yml"
        - "add-approved-feed.yml"
        - "process-feeds.yml"
        - "validate-all-feeds.yml"
        - "ci.yml"
        - "python-quality.yml"
        - "pr-validation.yml"
        - "auto-fix.yml"
        - "release.yml"
        - "Other"
    validations:
      required: true

  - type: input
    id: workflow_run_url
    attributes:
      label: Workflow Run URL
      description: Link to the relevant workflow run.
      placeholder: "https://github.com/wyattowalsh/ai-web-feeds/actions/runs/123456789"
    validations:
      required: true

  - type: dropdown
    id: failure_type
    attributes:
      label: Failure Type
      options:
        - "Workflow fails to start"
        - "Step fails"
        - "Validation output is incorrect"
        - "Automation wrote the wrong thing"
        - "Permission or token issue"
        - "Artifact issue"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: failing_step
    attributes:
      label: Failing Step
      description: Paste the step name and the most relevant log lines.
      render: shell
    validations:
      required: true

  - type: textarea
    id: command_or_script
    attributes:
      label: Command or Script Being Run
      description: Copy the exact command or script from the logs or workflow file.
      placeholder: |
        uv run python .github/scripts/feed_submission_to_source.py --event-path ...
        uv run python data/validate_data_assets.py
        uv run ai-web-feeds process --input data/feeds.yaml --output data/feeds.enriched.yaml
      render: bash
    validations:
      required: false

  - type: textarea
    id: local_test
    attributes:
      label: Local Test Results
      description: If you ran the command locally, what happened?
      render: shell
    validations:
      required: false

  - type: dropdown
    id: trigger
    attributes:
      label: Workflow Trigger
      options:
        - "Issue opened or edited"
        - "Label added"
        - "Pull request"
        - "Push to main"
        - "Scheduled run"
        - "Manual workflow_dispatch"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Workflow Context
      description: Include branch, PR, issue number, commit SHA, or recent changes that matter.
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: What impact does this issue have?
      options:
        - label: "Blocking issue intake or approval"
        - label: "Blocking PR merges"
        - label: "Blocking releases"
        - label: "Causing incorrect automation output"
        - label: "Intermittent or flaky"

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should the workflow do instead?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What did the workflow do instead?
    validations:
      required: true

  - type: textarea
    id: proposed_fix
    attributes:
      label: Proposed Fix (optional)
      description: Suggest a safer or more correct workflow behavior if you have one.
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: debugging_steps
    attributes:
      label: Debugging Steps Attempted
      options:
        - label: "Re-ran the workflow"
        - label: "Checked workflow logs"
        - label: "Tested the command locally"
        - label: "Reviewed recent changes to the workflow file"
        - label: "Checked docs and related issues"

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Information
      description: Add any screenshots, related issues, or notes here.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ### Helpful commands

        ```bash
        gh run list --workflow=validate-feed-submission.yml
        gh run view <run-id> --log
        uv run python data/validate_data_assets.py
        ```

        Thanks for helping keep repository automation safe and reviewable. 🚀
