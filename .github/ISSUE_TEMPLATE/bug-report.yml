name: 🐛 Bug Report
description: Report a bug affecting the project, data, docs, or automation
title: "[Bug]: "
labels: ["type/bug", "status/needs-review"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Thanks for taking the time to report a bug.

        ### Before reporting

        - Search [existing issues](https://github.com/wyattowalsh/ai-web-feeds/issues) for duplicates.
        - Update your checkout with `git pull origin main && uv sync`.
        - Review the relevant docs:
          - [Getting Started](https://aiwebfeeds.com/docs/guides/getting-started#troubleshooting)
          - [GitHub Infrastructure](https://aiwebfeeds.com/docs/guides/github-infrastructure#troubleshooting)

        ### Helpful debugging commands

        ```bash
        AIWF_LOGGING__LEVEL=DEBUG uv run ai-web-feeds <command>
        uv run python data/validate_data_assets.py
        cd apps/web && pnpm lint
        ```

        Prefer the `ai-web-feeds` command name in examples. The legacy `aiwebfeeds` alias is still accepted, but new guidance should use the canonical entry point.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - "Core package"
        - "CLI"
        - "Web application"
        - "Feed data or schema"
        - "GitHub automation"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Summarize the bug clearly and concisely.
      placeholder: "When I try to..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps needed to trigger the bug.
      placeholder: |
        1. Run `uv run ai-web-feeds ...`
        2. Open `...`
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: "I expected..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
      placeholder: "Instead..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: Paste the relevant output, stack trace, or workflow log excerpt.
      placeholder: |
        AIWF_LOGGING__LEVEL=DEBUG uv run ai-web-feeds <command>
        Traceback (most recent call last):
          ...
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of the commands below when they apply to your bug.
      placeholder: |
        uname -a
        uv --version
        uv run python --version
        uv run python -c "import ai_web_feeds; print(ai_web_feeds.__version__)"
        node --version
        pnpm --version
      render: shell
    validations:
      required: true

  - type: textarea
    id: cli_output
    attributes:
      label: CLI Command Output (if applicable)
      description: For CLI bugs, include the exact command and its full output.
      placeholder: |
        AIWF_LOGGING__LEVEL=DEBUG uv run ai-web-feeds validate data/feeds.yaml
      render: shell
    validations:
      required: false

  - type: textarea
    id: workflow_info
    attributes:
      label: Workflow Information (if applicable)
      description: For automation bugs, include the workflow file, run URL, and failing step.
      placeholder: |
        Workflow: .github/workflows/validate-feed-submission.yml
        Run: https://github.com/wyattowalsh/ai-web-feeds/actions/runs/123456789
        Step: Normalize issue submission
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: attempted_fixes
    attributes:
      label: Attempted Fixes
      description: Tell us what you already tried.
      options:
        - label: "Updated the repo with `git pull origin main && uv sync`"
        - label: "Retried with `AIWF_LOGGING__LEVEL=DEBUG`"
        - label: "Ran `uv run python data/validate_data_assets.py`"
        - label: "Ran `cd apps/web && pnpm lint` for web-related issues"
        - label: "Checked docs and existing issues"

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add screenshots, related issues, or any extra details here.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ### What happens next?

        1. Maintainers triage the report and confirm scope.
        2. Reproduction details are verified against the live repo and workflow configuration.
        3. Fixes land through a reviewed pull request.

        Thanks for helping improve AI Web Feeds! 🙏
